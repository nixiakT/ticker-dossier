name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project quality tools
        run: python -m pip install --upgrade pip ".[dev]"
      - name: Lint
        run: python -m ruff check src tests evals scripts
      - name: Check complexity ratchets
        run: python scripts/ci/check_complexity.py
      - name: Compile Python modules
        run: python -m compileall -q src/ticker_dossier evals tests scripts
      - name: Type-check stable contracts
        run: python -m mypy

  tests:
    name: Tests · ${{ matrix.label }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Ubuntu
            python-version: "3.11"
          - os: ubuntu-latest
            label: Ubuntu
            python-version: "3.12"
          - os: ubuntu-latest
            label: Ubuntu
            python-version: "3.13"
          - os: windows-latest
            label: Windows
            python-version: "3.13"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run test suite
        run: python -m pytest -q

  package:
    name: Package · wheel smoke
    needs: [static-analysis, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the installed wheel
        run: |
          WHEEL_ENV="$RUNNER_TEMP/ticker-dossier-wheel"
          python -m venv "$WHEEL_ENV"
          "$WHEEL_ENV/bin/python" -m pip install --upgrade pip
          "$WHEEL_ENV/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$WHEEL_ENV/bin/python" "$GITHUB_WORKSPACE/scripts/ci/smoke_installed.py"
      - name: Upload distributions
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ticker-dossier-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
