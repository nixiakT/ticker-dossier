name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: python -m pip install --upgrade pip mypy ruff
      - name: Lint
        run: ruff check src tests evals
      - name: Guard legacy complexity ceilings
        run: |
          ruff check --isolated --select C901 --config "lint.mccabe.max-complexity=39" src/ticker_dossier/research/portfolio/scoring.py
          ruff check --isolated --select C901 --config "lint.mccabe.max-complexity=31" src/ticker_dossier/research/quality.py
      - name: Compile all Python modules
        run: python -m compileall -q src/ticker_dossier evals tests
      - name: Type-check stable contracts
        run: >-
          mypy --strict
          src/ticker_dossier/bootstrap.py
          src/ticker_dossier/security.py
          src/ticker_dossier/runtime
          src/ticker_dossier/research/protocols.py
          src/ticker_dossier/research/models.py
          src/ticker_dossier/research/market_data
          src/ticker_dossier/llm/deepseek.py
          src/ticker_dossier/llm/fake.py
          src/ticker_dossier/integrations/market_data
          src/ticker_dossier/integrations/mcp
          src/ticker_dossier/cli/command_types.py
          src/ticker_dossier/cli/command_catalog.py
          src/ticker_dossier/cli/custom_commands.py
          src/ticker_dossier/cli/dynamic_commands.py

  tests:
    name: Core tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core package and test dependencies
        run: python -m pip install --upgrade pip ".[test]"
      - name: Run test suite
        run: python -m pytest -q

  package:
    name: Build and install wheel
    needs: [quality, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          WHEEL_ENV="$RUNNER_TEMP/ticker-dossier-wheel"
          python -m venv "$WHEEL_ENV"
          "$WHEEL_ENV/bin/python" -m pip install --upgrade pip
          "$WHEEL_ENV/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$WHEEL_ENV/bin/python" - <<'PY'
          from importlib.metadata import version
          from ticker_dossier.resources import bundled_mcp_config
          from ticker_dossier.skills.loader import load_skills

          names = {skill.name for skill in load_skills()}
          assert "finance-stock-research" in names
          assert "trace2skill" in names
          assert bundled_mcp_config().is_file()
          print(f"ticker-dossier {version('ticker-dossier')}: {len(names)} bundled Skills")
          PY
          "$WHEEL_ENV/bin/ticker-dossier" --help
          "$WHEEL_ENV/bin/python" -m ticker_dossier --selfcheck
          "$WHEEL_ENV/bin/python" -m pip check
      - uses: actions/upload-artifact@v4
        with:
          name: ticker-dossier-dist
          path: dist/*
          if-no-files-found: error
